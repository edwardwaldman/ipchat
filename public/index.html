<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ipchat</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 15px monospace; }
  body { padding: 12px; box-sizing: border-box; overflow-y: auto; }
  h1 { margin: 0 0 10px; font: bold 15px monospace; color: #fff; }
  #log { white-space: pre-wrap; word-break: break-word; }
  #log .sys { color: #777; }
  #log .bad { color: #f44; }
  #reqs { color: #e5c07b; }
  #reqs:empty { display: none; }
  #home { color: inherit; text-decoration: none; }
  #prompt.home { cursor: pointer; }
  #prompt.home:hover, #home:hover { text-decoration: underline; }
  #plus { color: #777; cursor: pointer; display: none; margin-right: 6px; }
  #plus:hover { color: #ddd; }
  #line.chat #plus { display: inline; }
  #log a { color: #8ab4f8; }
  #ping { color: #777; font-weight: normal; margin-left: 10px; }
  #line { white-space: pre-wrap; word-break: break-word; cursor: text; }
  #line.locked { display: none; }
  #prompt { color: #777; }
  #cursor { display: inline-block; width: 2px; height: 1.1em; margin-left: 1px; vertical-align: text-bottom; background: #ddd; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* real input is invisible; it just receives keystrokes (and opens the phone keyboard) */
  #input { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>
</head>
<body>
<h1><a id="home" href="">ipchat</a><span id="ping"></span></h1>
<div id="log"></div>
<div id="reqs"></div>
<div id="line"><span id="plus" title="send a file">[+]</span><span id="prompt">ip&gt; </span><span id="typed"></span><span id="cursor"></span></div>
<form id="form" autocomplete="off"><input id="file" type="file" hidden><input id="input" autofocus autocapitalize="off" autocorrect="off" spellcheck="false"></form>
<script src="/peerjs.min.js"></script>
<script>
  // Messages go directly browser-to-browser (WebRTC). The PeerJS server only
  // helps the two browsers find each other; it never sees the chat.
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const prompt = document.getElementById('prompt');
  const typed = document.getElementById('typed');
  const lineEl = document.getElementById('line');

  // Typing goes straight to the prompt line: no clicking needed.
  const sync = () => { typed.textContent = input.value; document.body.scrollTop = document.body.scrollHeight; };
  input.addEventListener('input', sync);
  const grab = () => { if (document.activeElement !== input) input.focus({ preventScroll: true }); };
  document.addEventListener('click', grab);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && (state === 'chat' || state === 'waiting')) return goHome(e);
    if (document.activeElement === input || e.ctrlKey || e.metaKey || e.altKey) return;
    grab();
    if (e.key.length === 1) { input.value += e.key; sync(); e.preventDefault(); }
    else if (e.key === 'Backspace') { input.value = input.value.slice(0, -1); sync(); e.preventDefault(); }
    else if (e.key === 'Enter') { form.requestSubmit(); e.preventDefault(); }
  });
  window.addEventListener('focus', grab);
  setLocked(false);
  grab();

  function setLocked(on) {
    input.disabled = on;
    lineEl.classList.toggle('locked', on);
    if (!on) setTimeout(grab, 0);
  }
  window.onerror = (m) => line('error: ' + m, 'bad');
  let state = 'ip'; // ip -> waiting -> chat -> done
  let me = null, target = null, peer = null, conn = null, connInit = null;

  function line(text, sys) {
    const div = document.createElement('div');
    if (sys) div.className = sys === 'bad' ? 'bad' : 'sys';
    div.textContent = text;
    log.appendChild(div);
    document.body.scrollTop = document.body.scrollHeight;
  }

  async function hash(s) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ipchat:' + TEST + s));
    return 'ipchat-' + [...new Uint8Array(buf)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Test mode: ?as=1.1.1.1 pretends to be that ip. Test users can only match other test users.
  const fakeIp = new URLSearchParams(location.search).get('as');
  const TEST = fakeIp ? 'test:' : '';

  (fakeIp ? Promise.resolve({ ip: fakeIp.slice(0, 64) }) : fetch('/api/ip', { cache: 'no-store' }).then(r => r.json())
    .then(d => d.ip ? d : Promise.reject())
    .catch(() => fetch('https://api.ipify.org?format=json').then(r => r.json()))).then(d => {
    me = d.ip;
    if (TEST) line('[test mode]', true);
    line('your ip: ' + me, true);
    line('type the ip you want to connect to', true);
    listen();
  }).catch(() => line('could not get your ip, reload the page', 'bad'));

  const pingEl = document.getElementById('ping');
  let pingTimer = null, unanswered = 0; // when our oldest unanswered ping went out

  // Inbox: while you're not chatting, anyone who types your ip pings this so you
  // can see how many are requesting you. Their ip is never shown or sent.
  const reqsEl = document.getElementById('reqs');
  let inbox = null, outbox = null, outboxTimer = null;
  const requesters = new Map(); // conn -> last time heard

  function showReqs() {
    const now = Date.now();
    for (const [c, t] of requesters) if (now - t > 8000 || !c.open) requesters.delete(c);
    const n = requesters.size;
    reqsEl.textContent = n && state !== 'chat' && state !== 'done' ? 'an ip is requesting you (' + n + ')' : '';
  }
  setInterval(showReqs, 2000);

  async function listen(tries = 0) {
    if (typeof Peer === 'undefined' || state === 'chat' || state === 'done') return;
    inbox = new Peer(await hash('inbox>' + me), await getPeerOpts());
    inbox.on('connection', c => {
      c.on('data', d => { if (d && d.t === 'req') { requesters.set(c, Date.now()); showReqs(); } });
      c.on('close', () => { requesters.delete(c); showReqs(); });
    });
    // another tab on this ip holds the inbox (or an old one is still closing): retry
    inbox.on('error', err => {
      if (err.type === 'unavailable-id' && tries < 60) { inbox.destroy(); inbox = null; setTimeout(() => listen(tries + 1), 3000); }
    });
  }

  function stopListening() {
    if (inbox) inbox.destroy();
    inbox = null;
    requesters.clear();
    showReqs();
  }

  // While waiting, keep pinging the target's inbox so they see the request.
  async function request() {
    const box = await hash('inbox>' + target);
    const tick = () => {
      if (state !== 'waiting' || !peer || peer.destroyed) return stopRequesting();
      if (peer.open && (!outbox || !outbox.open)) {
        if (outbox) outbox.close();
        const c = outbox = peer.connect(box, { reliable: true });
        c.on('open', () => { if (state === 'waiting') c.send({ t: 'req' }); });
      }
      if (outbox && outbox.open) outbox.send({ t: 'req' });
    };
    outboxTimer = setInterval(tick, 3000);
    if (peer.open) tick(); else peer.on('open', tick);
  }

  // If the other side answered but the direct link fails, say so instead of waiting silently.
  let iceWarned = false;
  let pending = null, foundSaid = false;
  function watchIce(c) {
    const check = () => {
      const pc = c.peerConnection;
      if (!pc) return setTimeout(check, 500);
      pc.addEventListener('iceconnectionstatechange', () => {
        const s = pc.iceConnectionState;
        if (state !== 'waiting') return;
        if ((s === 'checking' || s === 'connected') && !foundSaid) { foundSaid = true; line('found ' + target + ', connecting...', true); }
        if (s === 'failed') {
          if (pending && pending.c === c) pending.dead = true;
          if (!iceWarned) { iceWarned = true; line(target + ' is here, but a network or vpn is blocking the connection. still trying... (turn off any vpn, or try another network)', 'bad'); }
        }
      });
    };
    check();
  }

  function stopRequesting() {
    clearInterval(outboxTimer);
    if (outbox) outbox.close();
    outbox = null;
  }

  function end(msg) {
    stopListening();
    stopRequesting();
    if (state === 'done') return;
    if (msg) line(msg, 'bad');
    clearInterval(pingTimer);
    pingEl.textContent = '';
    state = 'done';
    setLocked(true);
    if (peer) peer.destroy();
  }

  // Other side left: show it for a moment, then wipe everything and go back home.
  function left() {
    if (state === 'done') return;
    end(target + ' disconnected');
    setTimeout(() => location.reload(), 1500);
  }

  // Both sides may dial at once; keep the connection started by the smaller id so both agree.
  function adopt(c, initiator) {
    if (state === 'done') return c.close();
    if (conn && conn !== c) {
      if (initiator < connInit) { const old = conn; conn = c; connInit = initiator; old.close(); }
      else return c.close();
    } else { conn = c; connInit = initiator; }

    c.on('data', d => {
      if (c !== conn || typeof d !== 'object' || !d) return;
      unanswered = 0;
      if (d.t === 'ping') return c.send({ t: 'pong', ts: d.ts });
      if (d.t === 'pong') return void (pingEl.textContent = 'ping ' + Math.max(0, Date.now() - d.ts) + 'ms');
      if (d.t === 'file' && d.data) fileLine(target, d.name, d.type, d.data);
      else if (d.t === 'msg' && typeof d.text === 'string') line(target + ': ' + d.text.slice(0, 2000));
      else if (d.t === 'bye') left();
    });
    c.on('close', () => { if (c === conn) left(); });

    if (state !== 'chat') {
      state = 'chat';
      stopListening();
      stopRequesting();
      log.textContent = '';
      line('connected to ' + target, true);
      prompt.textContent = me + ': ';
      prompt.className = 'home';
      lineEl.classList.add('chat');
      prompt.title = 'leave chat';
      setLocked(false);
      // Ping every 2s; if a ping goes unanswered for 15s (big files can delay it) the other side is gone.
      const ping = () => {
        if (unanswered && Date.now() - unanswered > 15000) return left();
        if (!conn || !conn.open) return;
        if (!unanswered) unanswered = Date.now();
        conn.send({ t: 'ping', ts: Date.now() });
      };
      pingTimer = setInterval(ping, 2000);
      ping();
    }
  }

  // How browsers reach each other. STUN finds a direct path; TURN relays when
  // networks block direct connections. Relays only pass encrypted data along.
  const FALLBACK_ICE = [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] },
    { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
    { urls: ['turn:freestun.net:3478', 'turns:freestun.net:5349'], username: 'free', credential: 'free' },
    { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' },
  ];
  let peerOpts = null;
  async function getPeerOpts() {
    if (peerOpts) return peerOpts;
    let extra = [];
    try {
      const ctl = new AbortController();
      setTimeout(() => ctl.abort(), 3000);
      extra = (await fetch('/api/turn', { cache: 'no-store', signal: ctl.signal }).then(r => r.json())).iceServers || [];
    } catch {}
    if (!window.PEER_OPTS) line(extra.length ? 'relay: on' : 'relay: off (only direct connections; may fail across networks)', true);
    return peerOpts = Object.assign({ config: { iceServers: [...extra, ...FALLBACK_ICE] } }, window.PEER_OPTS);
  }

  async function start() {
    if (typeof Peer === 'undefined') return end('error: chat library failed to load, reload the page');
    const mine = await hash(me + '>' + target), theirs = await hash(target + '>' + me);

    await getPeerOpts();
    line('waiting for ' + target + ' to enter your ip...', true);
    join(mine, theirs, 0);
    request();
  }

  // Register as `mine` and dial `theirs`. If our id is still held by an old tab
  // (it takes the server a while to notice it closed), keep retrying.
  function join(mine, theirs, tries) {
    if (state === 'done') return;
    peer = new Peer(mine, peerOpts);
    const me_ = peer;
    peer.on('open', id => {
      // keep dialing while waiting: they may arrive later, or an attempt may fail.
      // An attempt that is still connecting gets time to finish (relays can be slow).
      let t = null;
      const dial = () => {
        if (peer !== me_ || state !== 'waiting') return clearInterval(t);
        if (pending && !pending.dead && Date.now() - pending.at < 20000) return;
        if (pending && !pending.c.open) pending.c.close();
        const c = peer.connect(theirs, { reliable: true });
        pending = { c, at: Date.now(), dead: false };
        c.on('open', () => adopt(c, id));
        watchIce(c);
      };
      t = setInterval(dial, 3000);
      dial();
    });
    peer.on('connection', c => { c.on('open', () => adopt(c, c.peer)); watchIce(c); });
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') { if (pending && String(err.message).includes(theirs)) pending.dead = true; return; } // not here yet, keep waiting
      if (err.type === 'unavailable-id') {
        peer.destroy();
        if (tries > 60) return end('someone on your ip is already waiting for ' + target);
        return setTimeout(() => join(mine, theirs, tries + 1), 2000);
      }
      if (state !== 'chat') end('error: ' + err.type);
    });
  }

  // Files go straight to the other person like messages. Nothing is uploaded anywhere.
  const MAX_FILE = 25 * 1024 * 1024;
  const fileInput = document.getElementById('file');
  const size = (n) => n < 1024 ? n + 'b' : n < 1048576 ? (n / 1024).toFixed(0) + 'kb' : (n / 1048576).toFixed(1) + 'mb';

  function fileLine(from, name, type, data) {
    const blob = new Blob([data], { type: String(type || '') });
    const div = document.createElement('div');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = String(name || 'file').slice(0, 200);
    a.textContent = a.download;
    div.append(from + ': [file] ', a, ' (' + size(blob.size) + ')');
    log.appendChild(div);
    document.body.scrollTop = document.body.scrollHeight;
  }

  document.getElementById('plus').addEventListener('click', (e) => {
    e.stopPropagation();
    if (state === 'chat') fileInput.click();
  });
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files[0];
    fileInput.value = '';
    if (!f || state !== 'chat' || !conn || !conn.open) return;
    if (f.size > MAX_FILE) return line('file too big (max 25mb)', 'bad');
    const data = await f.arrayBuffer();
    conn.send({ t: 'file', name: f.name, type: f.type, data });
    fileLine(me, f.name, f.type, data);
    grab();
  });

  function sayBye() { if (conn && conn.open) try { conn.send({ t: 'bye' }); } catch {} }
  window.addEventListener('pagehide', () => { sayBye(); if (peer) peer.destroy(); stopListening(); });

  // Clicking "ipchat" or your ip leaves the chat and goes back to the start.
  function goHome(e) {
    e.preventDefault();
    e.stopPropagation();
    sayBye();
    setTimeout(() => { if (peer) peer.destroy(); stopListening(); location.reload(); }, 100);
  }
  document.getElementById('home').addEventListener('click', goHome);
  prompt.addEventListener('click', (e) => { if (state === 'chat') goHome(e); });

  form.onsubmit = (e) => {
    e.preventDefault();
    const v = input.value;
    if (!v.trim() || (state === 'ip' && !me)) return;
    input.value = '';
    sync();
    if (state === 'ip' && me) {
      if (v.trim() === me) return line("you can't connect to your own ip", 'bad');
      state = 'waiting';
      target = v.trim().slice(0, 64);
      setLocked(true);
      start();
    } else if (state === 'chat' && conn && conn.open) {
      const text = v.slice(0, 2000);
      conn.send({ t: 'msg', text });
      line(me + ': ' + text);
    }
  };
</script>
</body>
</html>
