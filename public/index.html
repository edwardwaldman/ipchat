<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ipchat</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 15px monospace; }
  body { display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; }
  h1 { margin: 0 0 10px; font: bold 15px monospace; color: #fff; }
  #log { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  #log .sys { color: #777; }
  form { display: flex; gap: 6px; margin-top: 8px; }
  #prompt { color: #777; }
  input { flex: 1; background: #000; color: #ddd; border: 0; border-bottom: 1px solid #444; font: inherit; outline: none; }
  input:disabled { opacity: .4; }
</style>
</head>
<body>
<h1>ipchat</h1>
<div id="log"></div>
<form id="form" autocomplete="off">
  <span id="prompt">ip&gt;</span>
  <input id="input" autofocus>
</form>
<script src="/peerjs.min.js"></script>
<script>
  // Messages go directly browser-to-browser (WebRTC). The PeerJS server only
  // helps the two browsers find each other; it never sees the chat.
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const prompt = document.getElementById('prompt');
  window.onerror = (m) => line('error: ' + m, true);
  let state = 'ip'; // ip -> waiting -> chat -> done
  let me = null, target = null, peer = null, conn = null, connInit = null;

  function line(text, sys) {
    const div = document.createElement('div');
    if (sys) div.className = 'sys';
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  async function hash(s) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('ipchat:' + TEST + s));
    return 'ipchat-' + [...new Uint8Array(buf)].slice(0, 16).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Test mode: ?as=1.1.1.1 pretends to be that ip. Test users can only match other test users.
  const fakeIp = new URLSearchParams(location.search).get('as');
  const TEST = fakeIp ? 'test:' : '';

  input.disabled = true;
  (fakeIp ? Promise.resolve({ ip: fakeIp.slice(0, 64) }) : fetch('/api/ip', { cache: 'no-store' }).then(r => r.json())).then(d => {
    me = d.ip;
    if (TEST) line('[test mode]', true);
    line('your ip: ' + me, true);
    line('type the ip you want to connect to', true);
    input.disabled = false;
    input.focus();
  }).catch(() => line('could not get your ip, reload the page', true));

  function end(msg) {
    if (state === 'done') return;
    if (msg) line(msg, true);
    state = 'done';
    input.disabled = true;
    prompt.textContent = '>';
    if (peer) peer.destroy();
  }

  // Both sides may dial at once; keep the connection started by the smaller id so both agree.
  function adopt(c, initiator) {
    if (state === 'done') return c.close();
    if (conn && conn !== c) {
      if (initiator < connInit) { const old = conn; conn = c; connInit = initiator; old.close(); }
      else return c.close();
    } else { conn = c; connInit = initiator; }

    c.on('data', d => {
      if (c !== conn || typeof d !== 'object' || !d) return;
      if (d.t === 'msg' && typeof d.text === 'string') line(target + ': ' + d.text.slice(0, 2000));
      else if (d.t === 'bye') end(target + ' disconnected');
    });
    c.on('close', () => { if (c === conn) end(target + ' disconnected'); });

    if (state !== 'chat') {
      state = 'chat';
      log.textContent = '';
      line('connected to ' + target, true);
      prompt.textContent = me + '>';
      input.disabled = false;
      input.focus();
    }
  }

  async function start() {
    if (typeof Peer === 'undefined') return end('error: chat library failed to load, reload the page');
    let mine, theirs;
    if (me === target) { const h = await hash(me + '>' + me); mine = h + 'a'; theirs = h + 'b'; }
    else { mine = await hash(me + '>' + target); theirs = await hash(target + '>' + me); }

    peer = new Peer(mine);
    peer.on('open', id => {
      line('waiting for ' + target + ' to enter your ip...', true);
      const c = peer.connect(theirs, { reliable: true });
      c.on('open', () => adopt(c, id));
    });
    peer.on('connection', c => c.on('open', () => adopt(c, c.peer)));
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') return; // they're not here yet, keep waiting
      if (err.type === 'unavailable-id' && me === target && !mine.endsWith('b')) {
        peer.destroy(); [mine, theirs] = [theirs, mine];
        peer = null; return restart(mine, theirs);
      }
      if (err.type === 'unavailable-id') return end('someone on your ip is already waiting for ' + target);
      if (state !== 'chat') end('error: ' + err.type);
    });
  }

  // Same-ip case: the "a" slot was taken, so take "b" and dial "a".
  function restart(mine, theirs) {
    peer = new Peer(mine);
    peer.on('open', id => {
      const c = peer.connect(theirs, { reliable: true });
      c.on('open', () => adopt(c, id));
    });
    peer.on('connection', c => c.on('open', () => adopt(c, c.peer)));
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') return;
      if (err.type === 'unavailable-id') return end('someone on your ip is already waiting for ' + target);
      if (state !== 'chat') end('error: ' + err.type);
    });
  }

  window.addEventListener('pagehide', () => {
    if (conn && conn.open) try { conn.send({ t: 'bye' }); } catch {}
  });

  form.onsubmit = (e) => {
    e.preventDefault();
    const v = input.value;
    if (!v.trim()) return;
    input.value = '';
    if (state === 'ip' && me) {
      state = 'waiting';
      target = v.trim().slice(0, 64);
      input.disabled = true;
      start();
    } else if (state === 'chat' && conn && conn.open) {
      const text = v.slice(0, 2000);
      conn.send({ t: 'msg', text });
      line(me + ': ' + text);
    }
  };
</script>
</body>
</html>
