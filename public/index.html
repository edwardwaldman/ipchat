<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ipchat</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 15px monospace; }
  body { padding: 12px; box-sizing: border-box; overflow-y: auto; }
  h1 { margin: 0 0 10px; font: bold 15px monospace; color: #fff; }
  #log { white-space: pre-wrap; word-break: break-word; }
  #log .sys { color: #777; }
  #log .bad { color: #f44; }
  #reqs { color: #e5c07b; }
  #reqs:empty { display: none; }
  #home { color: inherit; text-decoration: none; }
  #prompt.home { cursor: pointer; }
  #prompt.home:hover, #home:hover { text-decoration: underline; }
  #plus { color: #777; cursor: pointer; display: none; margin-right: 6px; }
  #plus:hover { color: #ddd; }
  #line.chat #plus { display: inline; }
  #log a { color: #8ab4f8; }
  #ping { color: #777; font-weight: normal; margin-left: 10px; }
  #ping.ok { color: #6c6; }
  #ping.slow { color: #f44; }
  #line { white-space: pre-wrap; word-break: break-word; cursor: text; }
  #line.locked { display: none; }
  #prompt { color: #777; }
  #cursor { display: inline-block; width: 2px; height: 1.1em; margin-left: 1px; vertical-align: text-bottom; background: #ddd; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* real input is invisible; it just receives keystrokes (and opens the phone keyboard) */
  #input { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>
</head>
<body>
<h1><a id="home" href="">ipchat</a><span id="ping"></span></h1>
<div id="log"></div>
<div id="reqs"></div>
<div id="line"><span id="plus" title="send a file">[+]</span><span id="prompt">ip&gt; </span><span id="typed"></span><span id="cursor"></span></div>
<form id="form" autocomplete="off"><input id="file" type="file" hidden><input id="input" autofocus autocapitalize="off" autocorrect="off" spellcheck="false"></form>
<script src="/supabase.js"></script>
<script src="/app.js"></script>
</body>
</html>
